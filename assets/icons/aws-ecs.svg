  <rect x="8" y="8" width="48" height="48" rx="8" fill="#ED7100" />
  <!-- Container Hexagon Box -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="32,16 46,24 46,40 32,48 18,40 18,24" />
