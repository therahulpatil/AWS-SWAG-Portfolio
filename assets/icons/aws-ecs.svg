    <line x1="32" y1="32" x2="18" y2="24" />
  </g>
  <text x="32" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="8.5" text-anchor="middle">ECS</text>
</svg>
