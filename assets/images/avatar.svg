<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />
  
  <!-- Outer Glow Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#awsGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" />
  
  <!-- Stylized Cloud / Hexagon Core -->
  <polygon points="100,38 152,68 152,132 100,162 48,132 48,68" fill="#1E293B" stroke="url(#cyanGrad)" stroke-width="2.5" opacity="0.9" />
  
  <!-- Inner Developer Avatar Silhouette -->
  <!-- Head & Headphones -->
  <circle cx="100" cy="85" r="26" fill="#38BDF8" opacity="0.9" />
  <path d="M 72 85 A 28 28 0 0 1 128 85" fill="none" stroke="#FF9900" stroke-width="4" stroke-linecap="round" />
  <rect x="70" y="80" width="6" height="14" rx="3" fill="#FF9900" />
  <rect x="124" y="80" width="6" height="14" rx="3" fill="#FF9900" />

  <!-- Body / Hoodie with Cloud Emblem -->
  <path d="M 60 148 C 60 120, 75 116, 100 116 C 125 116, 140 120, 140 148 Z" fill="#0EA5E9" opacity="0.85" />
  
  <!-- AWS Golden Smile Accent -->
  <path d="M 82 135 Q 100 146 118 135" fill="none" stroke="#FF9900" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
  <polygon points="119,132 124,136 117,138" fill="#FF9900" />

  <!-- Orbiting AWS Sparkles -->
  <circle cx="152" cy="68" r="4" fill="#FF9900" filter="url(#glow)" />
  <circle cx="48" cy="132" r="3.5" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="100" cy="38" r="4.5" fill="#FF9900" filter="url(#glow)" />
</svg>
