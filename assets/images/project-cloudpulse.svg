<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#141e33" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="340" fill="url(#bgP1)" rx="12" />
  
  <!-- Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.6">
    <line x1="40" y1="60" x2="560" y2="60" />
    <line x1="40" y1="120" x2="560" y2="120" />
    <line x1="40" y1="180" x2="560" y2="180" />
    <line x1="40" y1="240" x2="560" y2="240" />
    <line x1="140" y1="40" x2="140" y2="280" />
    <line x1="280" y1="40" x2="280" y2="280" />
    <line x1="420" y1="40" x2="420" y2="280" />
  </g>

  <!-- Metric Dashboard Header -->
  <rect x="40" y="30" width="520" height="40" rx="8" fill="#1E293B" opacity="0.8" />
  <circle cx="65" cy="50" r="5" fill="#EF4444" />
  <circle cx="82" cy="50" r="5" fill="#F59E0B" />
  <circle cx="99" cy="50" r="5" fill="#10B981" />
  <text x="125" y="55" fill="#94A3B8" font-family="monospace" font-size="12">CloudPulse :: Real-time Telemetry Engine [us-east-1]</text>
  <rect x="460" y="40" width="80" height="20" rx="10" fill="#065F46" />
  <text x="475" y="54" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">● LIVE 99.9%</text>

  <!-- Metric Cards -->
  <rect x="40" y="85" width="160" height="65" rx="8" fill="#131C2E" stroke="#334155" stroke-width="1" />
  <text x="55" y="105" fill="#94A3B8" font-family="sans-serif" font-size="11">INVOCATIONS / MIN</text>
  <text x="55" y="132" fill="#00F0FF" font-family="sans-serif" font-size="20" font-weight="bold">14,280</text>

  <rect x="220" y="85" width="160" height="65" rx="8" fill="#131C2E" stroke="#334155" stroke-width="1" />
  <text x="235" y="105" fill="#94A3B8" font-family="sans-serif" font-size="11">P99 LATENCY</text>
  <text x="235" y="132" fill="#FF9900" font-family="sans-serif" font-size="20" font-weight="bold">18.4 ms</text>

  <rect x="400" y="85" width="160" height="65" rx="8" fill="#131C2E" stroke="#334155" stroke-width="1" />
  <text x="415" y="105" fill="#94A3B8" font-family="sans-serif" font-size="11">SERVERLESS ERROR RATE</text>
  <text x="415" y="132" fill="#10B981" font-family="sans-serif" font-size="20" font-weight="bold">0.001%</text>

  <!-- Telemetry Line Wave Area -->
  <path d="M 40 250 Q 100 230, 160 190 T 280 210 T 380 170 T 480 200 T 560 160 L 560 280 L 40 280 Z" fill="url(#glowLine)" opacity="0.15" />
  <path d="M 40 250 Q 100 230, 160 190 T 280 210 T 380 170 T 480 200 T 560 160" fill="none" stroke="url(#glowLine)" stroke-width="3.5" filter="url(#pGlow)" />

  <!-- Data Nodes -->
  <circle cx="160" cy="190" r="5" fill="#00F0FF" filter="url(#pGlow)" />
  <circle cx="280" cy="210" r="5" fill="#FF9900" filter="url(#pGlow)" />
  <circle cx="380" cy="170" r="5" fill="#FF9900" filter="url(#pGlow)" />
  <circle cx="480" cy="200" r="5" fill="#10B981" filter="url(#pGlow)" />
  <circle cx="560" cy="160" r="5" fill="#10B981" filter="url(#pGlow)" />

  <!-- Architecture Badges Bottom -->
  <g transform="translate(45, 298)">
    <rect x="0" y="0" width="85" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="12" y="15" fill="#CBD5E1" font-family="monospace" font-size="10">AWS Lambda</text>

    <rect x="95" y="0" width="80" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="108" y="15" fill="#CBD5E1" font-family="monospace" font-size="10">DynamoDB</text>

    <rect x="185" y="0" width="85" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="198" y="15" fill="#CBD5E1" font-family="monospace" font-size="10">API Gateway</text>

    <rect x="280" y="0" width="75" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="294" y="15" fill="#CBD5E1" font-family="monospace" font-size="10">Amplify</text>
  </g>
</svg>
