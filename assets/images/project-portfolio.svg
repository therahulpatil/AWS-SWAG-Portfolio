<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgPort" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1A1528" />
    </linearGradient>
    <linearGradient id="termGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="portGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#bgPort)" rx="12" />

  <!-- Window Container -->
  <rect x="35" y="25" width="530" height="255" rx="8" fill="#0A0E17" stroke="#334155" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="35" y="25" width="530" height="36" rx="8" fill="#1E293B" />
  <circle cx="55" cy="43" r="5" fill="#EF4444" />
  <circle cx="72" cy="43" r="5" fill="#F59E0B" />
  <circle cx="89" cy="43" r="5" fill="#10B981" />
  <text x="115" y="47" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="bold">aws-cloudshell :: builder@portfolio:~$</text>
  <rect x="440" y="33" width="110" height="20" rx="10" fill="#0F766E" />
  <text x="452" y="47" fill="#5EEAD4" font-family="monospace" font-size="10">● AWS Amplify</text>

  <!-- Terminal Content Lines -->
  <g font-family="monospace" font-size="11">
    <text x="55" y="85" fill="#94A3B8">$ amplify status --environment production</text>
    <text x="55" y="108" fill="#10B981">✔ Hosting: AWS Amplify Console (Global CDN Active)</text>
    <text x="55" y="126" fill="#10B981">✔ SSL/TLS: Managed Amazon Certificate (Active)</text>
    <text x="55" y="144" fill="#10B981">✔ Build status: 100/100 Lighthouse Performance</text>

    <text x="55" y="175" fill="#FF9900">$ builder --launch-superpowers</text>
    <text x="55" y="196" fill="#00F0FF">[+] Cloud Architectures: Event-Driven, Microservices, SQS</text>
    <text x="55" y="214" fill="#00F0FF">[+] Creative Feature: AWS CloudShell v2.0 Interactive CLI</text>
    <text x="55" y="232" fill="#E2E8F0">[+] Hint Trigger: Press [~] or click floating terminal pill</text>

    <text x="55" y="260" fill="#38BDF8">builder@aws-cloudshell:~$ <tspan fill="#FF9900">sudo deploy --winner</tspan><tspan fill="#00F0FF"> █</tspan></text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(40, 298)">
    <rect x="0" y="0" width="90" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="8" y="15" fill="#CBD5E1" font-family="monospace" font-size="10">AWS Amplify</text>

    <rect x="100" y="0" width="85" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="110" y="15" fill="#CBD5E1" font-family="monospace" font-size="10">CloudFront</text>

    <rect x="195" y="0" width="115" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="203" y="15" fill="#CBD5E1" font-family="monospace" font-size="10">Terminal Shell</text>

    <rect x="320" y="0" width="80" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="333" y="15" fill="#CBD5E1" font-family="monospace" font-size="10">Vanilla JS</text>
  </g>
</svg>
