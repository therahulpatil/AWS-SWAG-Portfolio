<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgOmni" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="sqsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="omniGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#bgOmni)" rx="12" />

  <!-- Pipeline Header -->
  <rect x="40" y="25" width="520" height="35" rx="6" fill="#1E293B" opacity="0.9" />
  <circle cx="60" cy="42" r="4.5" fill="#EF4444" />
  <circle cx="75" cy="42" r="4.5" fill="#F59E0B" />
  <circle cx="90" cy="42" r="4.5" fill="#10B981" />
  <text x="110" y="47" fill="#CBD5E1" font-family="monospace" font-size="11">OmniFlow :: Event-Driven Microservices Checkout [Zero Message Loss]</text>

  <!-- Microservice Flow Diagram -->
  <!-- Node 1: API Intake -->
  <g transform="translate(50, 95)">
    <rect x="0" y="0" width="95" height="130" rx="8" fill="#1E293B" stroke="#00F0FF" stroke-width="1.5" />
    <circle cx="47" cy="35" r="16" fill="#0284C7" />
    <text x="40" y="40" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13">API</text>
    <text x="18" y="75" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="10">API Gateway</text>
    <text x="12" y="95" fill="#94A3B8" font-family="sans-serif" font-size="9">Rate Limiting</text>
    <text x="12" y="110" fill="#94A3B8" font-family="sans-serif" font-size="9">JWT Validation</text>
  </g>

  <!-- Node 2: SQS Buffer -->
  <g transform="translate(185, 95)">
    <rect x="0" y="0" width="105" height="130" rx="8" fill="#1E293B" stroke="#FF9900" stroke-width="1.5" />
    <circle cx="52" cy="35" r="16" fill="#D97706" />
    <text x="41" y="40" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12">SQS</text>
    <text x="16" y="75" fill="#FBBF24" font-family="sans-serif" font-weight="bold" font-size="10">Amazon SQS</text>
    <text x="14" y="95" fill="#94A3B8" font-family="sans-serif" font-size="9">FIFO Queuing</text>
    <text x="14" y="110" fill="#94A3B8" font-family="sans-serif" font-size="9">DLQ Redundancy</text>
  </g>

  <!-- Node 3: Worker Lambdas -->
  <g transform="translate(330, 95)">
    <rect x="0" y="0" width="100" height="130" rx="8" fill="#1E293B" stroke="#EC4899" stroke-width="1.5" />
    <circle cx="50" cy="35" r="16" fill="#BE185D" />
    <text x="44" y="40" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">λ</text>
    <text x="12" y="75" fill="#F472B6" font-family="sans-serif" font-weight="bold" font-size="10">Worker Fleet</text>
    <text x="14" y="95" fill="#94A3B8" font-family="sans-serif" font-size="9">Auto-scaling</text>
    <text x="14" y="110" fill="#94A3B8" font-family="sans-serif" font-size="9">Batch Process</text>
  </g>

  <!-- Node 4: PostgreSQL RDS -->
  <g transform="translate(470, 95)">
    <rect x="0" y="0" width="85" height="130" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <circle cx="42" cy="35" r="16" fill="#059669" />
    <text x="34" y="40" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12">DB</text>
    <text x="12" y="75" fill="#34D399" font-family="sans-serif" font-weight="bold" font-size="10">PostgreSQL</text>
    <text x="10" y="95" fill="#94A3B8" font-family="sans-serif" font-size="9">ACID Compliant</text>
    <text x="10" y="110" fill="#94A3B8" font-family="sans-serif" font-size="9">Read Replicas</text>
  </g>

  <!-- Connecting Stream Lines -->
  <line x1="145" y1="160" x2="185" y2="160" stroke="#00F0FF" stroke-width="2.5" stroke-dasharray="4 2" />
  <line x1="290" y1="160" x2="330" y2="160" stroke="#FF9900" stroke-width="2.5" stroke-dasharray="4 2" />
  <line x1="430" y1="160" x2="470" y2="160" stroke="#EC4899" stroke-width="2.5" stroke-dasharray="4 2" />

  <!-- Bottom Badges -->
  <g transform="translate(50, 298)">
    <rect x="0" y="0" width="95" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="10" y="15" fill="#CBD5E1" font-family="monospace" font-size="10">Microservices</text>

    <rect x="105" y="0" width="90" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="115" y="15" fill="#CBD5E1" font-family="monospace" font-size="10">Amazon SQS</text>

    <rect x="205" y="0" width="85" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="217" y="15" fill="#CBD5E1" font-family="monospace" font-size="10">AWS Lambda</text>

    <rect x="300" y="0" width="70" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="314" y="15" fill="#CBD5E1" font-family="monospace" font-size="10">Node.js</text>
  </g>
</svg>
