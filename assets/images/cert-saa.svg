<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="saaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
  </defs>

  <!-- Outer Shield / Hexagon -->
  <polygon points="80,10 145,45 145,115 80,150 15,115 15,45" fill="url(#saaGrad)" stroke="url(#goldBorder)" stroke-width="4" />
  
  <!-- AWS Header -->
  <text x="80" y="42" fill="#FF9900" font-family="sans-serif" font-weight="800" font-size="14" text-anchor="middle" letter-spacing="1">AWS CERTIFIED</text>
  
  <!-- Inner Shield Arc -->
  <path d="M 40 50 Q 80 58 120 50" stroke="#FF9900" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- Title Text -->
  <text x="80" y="72" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">SOLUTIONS</text>
  <text x="80" y="88" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">ARCHITECT</text>
  
  <rect x="42" y="98" width="76" height="18" rx="9" fill="#FF9900" />
  <text x="80" y="111" fill="#0B0F19" font-family="sans-serif" font-weight="800" font-size="9" text-anchor="middle" letter-spacing="0.5">ASSOCIATE</text>

  <!-- Stars -->
  <text x="80" y="132" fill="#FFD700" font-size="10" text-anchor="middle">★ ★ ★</text>
</svg>
