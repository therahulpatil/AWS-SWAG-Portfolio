<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgVpc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="pubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="privGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <filter id="vpcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#bgVpc)" rx="12" />

  <!-- Top Title Bar -->
  <rect x="25" y="18" width="550" height="32" rx="6" fill="#1e293b" opacity="0.9" />
  <circle cx="45" cy="34" r="4.5" fill="#ef4444" />
  <circle cx="60" cy="34" r="4.5" fill="#f59e0b" />
  <circle cx="75" cy="34" r="4.5" fill="#10b981" />
  <text x="95" y="38" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="bold">AWS VPC :: 10.0.0.0/16 [Dual-Tier Public &amp; Private Subnets]</text>
  <rect x="470" y="24" width="95" height="20" rx="4" fill="#0f766e" />
  <text x="480" y="38" fill="#5eead4" font-family="monospace" font-size="9" font-weight="bold">● SECURE VPC</text>

  <!-- AWS Cloud Border -->
  <rect x="25" y="60" width="550" height="215" rx="8" fill="none" stroke="#ff9900" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8" />
  <text x="40" y="78" fill="#ff9900" font-family="monospace" font-size="10" font-weight="bold">AWS REGION / VPC [10.0.0.0/16]</text>

  <!-- Internet Gateway Node -->
  <g transform="translate(470, 70)">
    <rect x="0" y="0" width="90" height="30" rx="4" fill="#1e293b" stroke="#00f0ff" stroke-width="1" />
    <text x="14" y="20" fill="#00f0ff" font-family="sans-serif" font-size="10" font-weight="bold">🌐 IGW (Inbound)</text>
  </g>

  <!-- Public Subnet Container -->
  <rect x="40" y="95" width="235" height="165" rx="6" fill="url(#pubGrad)" stroke="#38bdf8" stroke-width="1.2" />
  <text x="50" y="115" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">PUBLIC SUBNET (10.0.1.0/24)</text>

  <!-- Bastion Host Inside Public Subnet -->
  <g transform="translate(55, 130)">
    <rect x="0" y="0" width="95" height="80" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="47" cy="22" r="12" fill="#d97706" />
    <text x="42" y="26" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">SSH</text>
    <text x="14" y="50" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="bold">Bastion Host</text>
    <text x="16" y="68" fill="#94a3b8" font-family="monospace" font-size="8">Port 22 Allowed</text>
  </g>

  <!-- NAT Gateway Inside Public Subnet -->
  <g transform="translate(165, 130)">
    <rect x="0" y="0" width="95" height="80" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <circle cx="47" cy="22" r="12" fill="#059669" />
    <text x="38" y="26" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">NAT</text>
    <text x="14" y="50" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold">NAT Gateway</text>
    <text x="12" y="68" fill="#94a3b8" font-family="monospace" font-size="8">Outbound Only</text>
  </g>

  <!-- Arrow from Public to Private -->
  <path d="M 275 170 L 320 170" stroke="#ff9900" stroke-width="2" stroke-dasharray="4 2" />
  <text x="280" y="162" fill="#ff9900" font-family="monospace" font-size="8">NACL / SG</text>

  <!-- Private Subnet Container -->
  <rect x="325" y="95" width="235" height="165" rx="6" fill="url(#privGrad)" stroke="#ef4444" stroke-width="1.2" />
  <text x="335" y="115" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="bold">PRIVATE SUBNET (10.0.2.0/24)</text>

  <!-- Web / App EC2 Instances -->
  <g transform="translate(340, 130)">
    <rect x="0" y="0" width="95" height="80" rx="6" fill="#18181b" stroke="#f43f5e" stroke-width="1" />
    <circle cx="47" cy="22" r="12" fill="#be123c" />
    <text x="40" y="26" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">EC2</text>
    <text x="16" y="50" fill="#fb7185" font-family="sans-serif" font-size="9" font-weight="bold">Web Server</text>
    <text x="14" y="68" fill="#a1a1aa" font-family="monospace" font-size="8">No Public IP</text>
  </g>

  <!-- Database / Critical Resource Instance -->
  <g transform="translate(450, 130)">
    <rect x="0" y="0" width="95" height="80" rx="6" fill="#18181b" stroke="#a855f7" stroke-width="1" />
    <circle cx="47" cy="22" r="12" fill="#7e22ce" />
    <text x="40" y="26" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">RDS</text>
    <text x="20" y="50" fill="#c084fc" font-family="sans-serif" font-size="9" font-weight="bold">Database</text>
    <text x="14" y="68" fill="#a1a1aa" font-family="monospace" font-size="8">Isolated Tier</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(40, 292)">
    <rect x="0" y="0" width="75" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="10" y="15" fill="#cbd5e1" font-family="monospace" font-size="10">AWS VPC</text>

    <rect x="85" y="0" width="90" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="95" y="15" fill="#cbd5e1" font-family="monospace" font-size="10">Bastion Host</text>

    <rect x="185" y="0" width="95" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="195" y="15" fill="#cbd5e1" font-family="monospace" font-size="10">NAT Gateway</text>

    <rect x="290" y="0" width="95" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="300" y="15" fill="#cbd5e1" font-family="monospace" font-size="10">Security Groups</text>

    <rect x="395" y="0" width="80" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="405" y="15" fill="#cbd5e1" font-family="monospace" font-size="10">NACL Rules</text>
  </g>
</svg>
