<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="ccpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="tealBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Outer Hexagon -->
  <polygon points="80,10 145,45 145,115 80,150 15,115 15,45" fill="url(#ccpGrad)" stroke="url(#tealBorder)" stroke-width="4" />
  
  <!-- AWS Header -->
  <text x="80" y="42" fill="#00F0FF" font-family="sans-serif" font-weight="800" font-size="14" text-anchor="middle" letter-spacing="1">AWS CERTIFIED</text>
  
  <path d="M 40 50 Q 80 58 120 50" stroke="#00F0FF" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- Title Text -->
  <text x="80" y="75" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="12" text-anchor="middle">CLOUD</text>
  <text x="80" y="93" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">PRACTITIONER</text>
  
  <rect x="42" y="102" width="76" height="16" rx="8" fill="#0284C7" />
  <text x="80" y="114" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="8" text-anchor="middle" letter-spacing="0.5">FOUNDATIONAL</text>

  <!-- Stars -->
  <text x="80" y="132" fill="#38BDF8" font-size="10" text-anchor="middle">★ ★ ★</text>
</svg>
