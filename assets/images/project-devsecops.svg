<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgDevSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#151b2e" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bgDevSec)" rx="12" />

  <!-- Window Header -->
  <rect x="25" y="18" width="550" height="32" rx="6" fill="#1e293b" opacity="0.9" />
  <circle cx="45" cy="34" r="4.5" fill="#ef4444" />
  <circle cx="60" cy="34" r="4.5" fill="#f59e0b" />
  <circle cx="75" cy="34" r="4.5" fill="#10b981" />
  <text x="95" y="38" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="bold">SecureDevOps :: Automated CI/CD &amp; Security Compliance Pipeline</text>
  <rect x="470" y="24" width="95" height="20" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" />
  <text x="478" y="38" fill="#c084fc" font-family="monospace" font-size="9" font-weight="bold">● DEVSECOPS</text>

  <!-- Stage 1: Infrastructure as Code -->
  <g transform="translate(35, 75)">
    <rect x="0" y="0" width="80" height="180" rx="6" fill="#131c2e" stroke="#00f0ff" stroke-width="1" />
    <text x="12" y="24" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold">IaC / Code</text>
    <circle cx="40" cy="60" r="16" fill="#0284c7" />
    <text x="32" y="65" fill="#fff" font-family="monospace" font-size="11">TF</text>
    <text x="14" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="bold">Terraform</text>
    <text x="10" y="115" fill="#94a3b8" font-family="sans-serif" font-size="8">AWS Infra</text>
    <text x="10" y="130" fill="#94a3b8" font-family="sans-serif" font-size="8">Git Trigger</text>
  </g>

  <!-- Stage 2: CI Orchestrator -->
  <g transform="translate(125, 75)">
    <rect x="0" y="0" width="80" height="180" rx="6" fill="#131c2e" stroke="#f59e0b" stroke-width="1" />
    <text x="12" y="24" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="bold">Pipeline</text>
    <circle cx="40" cy="60" r="16" fill="#d97706" />
    <text x="31" y="65" fill="#fff" font-family="monospace" font-size="11">JK</text>
    <text x="18" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="bold">Jenkins</text>
    <text x="10" y="115" fill="#94a3b8" font-family="sans-serif" font-size="8">Automated</text>
    <text x="10" y="130" fill="#94a3b8" font-family="sans-serif" font-size="8">Multibranch</text>
  </g>

  <!-- Stage 3: SAST & DAST Security -->
  <g transform="translate(215, 75)">
    <rect x="0" y="0" width="95" height="180" rx="6" fill="#131c2e" stroke="#10b981" stroke-width="1.2" />
    <text x="10" y="24" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold">SAST &amp; DAST</text>
    <circle cx="47" cy="60" r="16" fill="#059669" />
    <text x="40" y="65" fill="#fff" font-family="sans-serif" font-size="12">🛡️</text>
    <text x="14" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="bold">SonarQube</text>
    <text x="10" y="115" fill="#94a3b8" font-family="sans-serif" font-size="8">&amp; OWASP ZAP</text>
    <text x="10" y="130" fill="#10b981" font-family="sans-serif" font-size="8">Quality Gate</text>
  </g>

  <!-- Stage 4: Container Security -->
  <g transform="translate(320, 75)">
    <rect x="0" y="0" width="90" height="180" rx="6" fill="#131c2e" stroke="#ec4899" stroke-width="1" />
    <text x="12" y="24" fill="#f472b6" font-family="sans-serif" font-size="9" font-weight="bold">Containers</text>
    <circle cx="45" cy="60" r="16" fill="#be185d" />
    <text x="37" y="65" fill="#fff" font-family="sans-serif" font-size="12">🐳</text>
    <text x="16" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="bold">Docker</text>
    <text x="10" y="115" fill="#94a3b8" font-family="sans-serif" font-size="8">&amp; Trivy Scan</text>
    <text x="10" y="130" fill="#f472b6" font-family="sans-serif" font-size="8">CVE Checks</text>
  </g>

  <!-- Stage 5: Monitoring & Telemetry -->
  <g transform="translate(420, 75)">
    <rect x="0" y="0" width="145" height="180" rx="6" fill="#131c2e" stroke="#a855f7" stroke-width="1" />
    <text x="16" y="24" fill="#c084fc" font-family="sans-serif" font-size="9" font-weight="bold">Observability</text>
    <circle cx="72" cy="60" r="16" fill="#7e22ce" />
    <text x="64" y="65" fill="#fff" font-family="sans-serif" font-size="12">📈</text>
    <text x="24" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="bold">Prometheus</text>
    <text x="32" y="112" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="bold">&amp; Grafana</text>
    <text x="18" y="135" fill="#94a3b8" font-family="sans-serif" font-size="8">Real-time alerts</text>
    <text x="18" y="150" fill="#94a3b8" font-family="sans-serif" font-size="8">Cloud metrics</text>
  </g>

  <!-- Pipeline Connection Arrows -->
  <line x1="115" y1="135" x2="125" y2="135" stroke="#38bdf8" stroke-width="2" />
  <line x1="205" y1="135" x2="215" y2="135" stroke="#fbbf24" stroke-width="2" />
  <line x1="310" y1="135" x2="320" y2="135" stroke="#34d399" stroke-width="2" />
  <line x1="410" y1="135" x2="420" y2="135" stroke="#f472b6" stroke-width="2" />

  <!-- Bottom Badges -->
  <g transform="translate(35, 292)">
    <rect x="0" y="0" width="80" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="10" y="15" fill="#cbd5e1" font-family="monospace" font-size="10">Terraform</text>

    <rect x="90" y="0" width="70" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="100" y="15" fill="#cbd5e1" font-family="monospace" font-size="10">Jenkins</text>

    <rect x="170" y="0" width="85" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="180" y="15" fill="#cbd5e1" font-family="monospace" font-size="10">SonarQube</text>

    <rect x="265" y="0" width="80" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="278" y="15" fill="#cbd5e1" font-family="monospace" font-size="10">Trivy</text>

    <rect x="355" y="0" width="70" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="367" y="15" fill="#cbd5e1" font-family="monospace" font-size="10">Docker</text>

    <rect x="435" y="0" width="90" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="444" y="15" fill="#cbd5e1" font-family="monospace" font-size="10">Prometheus</text>
  </g>
</svg>
